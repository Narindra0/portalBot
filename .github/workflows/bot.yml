name: PortalJob Telegram Bot

on:
  workflow_dispatch:      # Lancement manuel uniquement

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright
      run: |
        playwright install chromium --with-deps

    - name: Restore Browser Sessions
      env:
        PORTAL_SESSION_JSON: ${{ secrets.PORTAL_SESSION_JSON }}
        ASAKO_SESSION_JSON: ${{ secrets.ASAKO_SESSION_JSON }}
      run: |
        if [ ! -z "$PORTAL_SESSION_JSON" ]; then
          echo "$PORTAL_SESSION_JSON" > portal_session.json
          echo "✅ PortalJob session restored."
        fi
        if [ ! -z "$ASAKO_SESSION_JSON" ]; then
          echo "$ASAKO_SESSION_JSON" > asako_session.json
          echo "✅ Asako session restored."
        fi

    - name: Run Telegram Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        HEADLESS: true
      run: python -m src.main bot
