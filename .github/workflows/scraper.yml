name: PortalJob Scraper

on:
  # Exécution automatique toutes les 2 heures
  schedule:
    - cron: '0 */2 * * *'
  
  # Exécution manuelle depuis GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        
    - name: Restore SQLite database
      uses: actions/cache@v3
      with:
        path: telegram_cache.db
        key: ${{ runner.os }}-db-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-db-
    
    - name: Exécution du scraper
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}
        HEADLESS: "true"
      run: |
        python -c "from src.scraper import surveiller_portal; surveiller_portal()"
        
    - name: Save SQLite database
      uses: actions/cache@v3
      with:
        path: telegram_cache.db
        key: ${{ runner.os }}-db-${{ github.sha }}-${{ github.run_id }}
