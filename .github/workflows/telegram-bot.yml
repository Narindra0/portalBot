name: Telegram Callback Handler

on:
  # Exécution continue (redémarrage toutes les 6 heures)
  schedule:
    - cron: '0 */6 * * *'
  
  workflow_dispatch:

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Restore SQLite database
      uses: actions/cache@v3
      with:
        path: telegram_cache.db
        key: ${{ runner.os }}-db-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-db-
    
    - name: Démarrage du bot Telegram (6h max)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}
      timeout-minutes: 360
      run: |
        timeout 21600 python -c "from src.telegram import poll_callbacks; poll_callbacks()" || true
        
    - name: Save SQLite database
      uses: actions/cache@v3
      with:
        path: telegram_cache.db
        key: ${{ runner.os }}-db-${{ github.sha }}-${{ github.run_id }}
